<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Spin Buttons UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Montserrat para tipografia gamer marcante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fundo do jogo com textura de folhagem/grama ninja */
        .game-bg {
            background-color: #3b7a1e;
            background-image: 
                radial-gradient(circle at 50% 50%, #529e2c 0%, #346a19 60%, #1e420c 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 10px, transparent 10px, transparent 20px);
        }

        /* Textura de Madeira Azul (1 Giro) */
        .wood-blue {
            background-color: #274862;
            background-image: 
                linear-gradient(180deg, #375f7f 0%, #203c53 50%, #172d3e 100%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px);
            box-shadow: 
                inset 0 2px 3px rgba(255, 255, 255, 0.4),
                inset 0 -3px 5px rgba(0, 0, 0, 0.6),
                0 8px 16px rgba(0, 0, 0, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* Textura de Madeira Vermelha/Castanha (10 Giros) */
        .wood-brown {
            background-color: #792d13;
            background-image: 
                linear-gradient(180deg, #9b3d1b 0%, #68230b 50%, #4b1705 100%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px);
            box-shadow: 
                inset 0 2px 3px rgba(255, 235, 170, 0.4),
                inset 0 -3px 5px rgba(0, 0, 0, 0.6),
                0 8px 16px rgba(0, 0, 0, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* Molduras Metal Prata e Ouro */
        .frame-silver {
            border: 3.5px solid #8ba0b3;
            outline: 2px solid #142330;
            box-shadow: 0 0 0 1px #465b6e, inset 0 0 0 1px #bfd1e0;
        }

        .frame-gold {
            border: 3.5px solid #d49a37;
            outline: 2px solid #2d1204;
            box-shadow: 0 0 0 1px #805417, inset 0 0 0 1px #fbe395;
        }

        /* Sombra de texto 3D para o botão */
        .text-game-shadow {
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px 3px 5px rgba(0,0,0,0.9);
        }

        /* Animação do botão ao pressionar */
        .ninja-btn {
            transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), filter 0.15s ease;
            cursor: pointer;
        }

        .ninja-btn:hover {
            filter: brightness(1.08);
        }

        .ninja-btn:active {
            transform: translateY(3px) scale(0.98) !important;
        }

        /* Animação de rotação da Shuriken ao clicar */
        .spin-icon {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .ninja-btn:active .spin-icon {
            transform: rotate(360deg) scale(1.1);
        }

        /* Partículas ao clicar */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 999;
            animation: particleFly 0.6s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5);
            }
        }

        /* Container do Texto Flutuante Animado */
        .floating-text-container {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            animation: floatAnimeGacha 0.9s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        @keyframes floatAnimeGacha {
            0% {
                opacity: 0;
                transform: translate(-50%, -10px) scale(0.3) rotate(var(--rot-start));
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -35px) scale(1.3) rotate(var(--rot-mid));
            }
            40% {
                transform: translate(-50%, -50px) scale(1.0) rotate(var(--rot-mid));
            }
            80% {
                opacity: 1;
                transform: translate(-50%, -90px) scale(1.05) rotate(var(--rot-mid));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -130px) scale(0.7) rotate(var(--rot-end));
            }
        }

        /* Texto 1 Giro - Ultra Legível Neon Azul / Prata */
        .silver-float-title {
            font-size: 2.2rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            text-align: center;
            line-height: 1;
            letter-spacing: 0.05em;
            text-shadow: 
                -2px -2px 0 #04121e, 
                 2px -2px 0 #04121e, 
                -2px  2px 0 #04121e, 
                 2px  2px 0 #04121e,
                 0 0 12px #38bdf8,
                 0 0 20px #0284c7;
        }

        .silver-float-badge {
            font-size: 0.75rem;
            font-weight: 900;
            background-color: #0284c7;
            color: #ffffff;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1.5px solid #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Texto 10 Giros - Ultra Legível Fogo / Ouro CRITICAL */
        .gold-float-badge {
            font-size: 0.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #dc2626, #ea580c, #dc2626);
            color: #fffde7;
            padding: 3px 12px;
            border-radius: 6px;
            border: 1.5px solid #fef08a;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 3px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.9), 0 3px 6px rgba(0,0,0,0.6);
            text-align: center;
            display: inline-block;
        }

        .gold-float-title {
            font-size: 2.6rem;
            font-weight: 900;
            font-style: italic;
            color: #ffea00;
            text-align: center;
            line-height: 1;
            letter-spacing: 0.04em;
            text-shadow: 
                -2px -2px 0 #280500, 
                 2px -2px 0 #280500, 
                -2px  2px 0 #280500, 
                 2px  2px 0 #280500,
                 0 0 15px #f59e0b,
                 0 0 30px #d97706;
        }
    </style>
</head>

    <script>
        // Web Audio API para efeitos sonoros sem arquivos externos
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'silver') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
                    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);

                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.25);

                    gain.gain.setValueAtTime(0.35, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        // Função Principal acionada ao Clicar nos Botões
        function triggerSpin(btn, theme) {
            playSound(theme);

            const rect = btn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // 1. Criar Partículas Explosivas
            const colors = theme === 'silver' 
                ? ['#38bdf8', '#ffffff', '#94a3b8', '#0284c7'] 
                : ['#fbbf24', '#f59e0b', '#ef4444', '#ffffff'];

            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.className = 'particle';

                const size = Math.random() * 8 + 4;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = `${centerX}px`;
                p.style.top = `${centerY}px`;

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 70 + 20;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;

                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }

            // 2. Criar Texto Flutuante Animado (Ultra-Legível & Perfeitamente Alinhado)
            createFloatingText(centerX, rect.top, theme);

            // 3. Exibir Mensagem de Feedback
            const toast = document.getElementById('toast');
            toast.innerText = theme === 'silver' ? '🌀 Giro Simples Efetuado!' : '🔥 10 Giros Efetuados com Sucesso!';
            toast.style.opacity = '1';

            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
            }, 1500);
        }

        // Construtor do Texto Animado Gacha
        function createFloatingText(x, y, theme) {
            const container = document.createElement('div');
            container.className = 'floating-text-container';
            
            const isSilver = theme === 'silver';

            if (isSilver) {
                container.innerHTML = `
                    <div class="silver-float-title">+1 GIRO!</div>
                    <div class="silver-float-badge">SINGLE PULL</div>
                `;
            } else {
                container.innerHTML = `
                    <div class="gold-float-badge">⚡ MEGA PULL ⚡</div>
                    <div class="gold-float-title">★ 10 GIROS! ★</div>
                `;
            }

            // Posição Inicial no topo do botão
            container.style.left = `${x}px`;
            container.style.top = `${y}px`;

            // Leve variação de rotação estilo anime
            const rotStart = `${(Math.random() * 12 - 6).toFixed(1)}deg`;
            const rotMid = `${(Math.random() * 6 - 3).toFixed(1)}deg`;
            const rotEnd = `${(Math.random() * 10 - 5).toFixed(1)}deg`;

            container.style.setProperty('--rot-start', rotStart);
            container.style.setProperty('--rot-mid', rotMid);
            container.style.setProperty('--rot-end', rotEnd);

            document.body.appendChild(container);

            // Apaga o container após término da animação
            setTimeout(() => {
                container.remove();
            }, 900);
        }
    </script>
</body>
</html>
