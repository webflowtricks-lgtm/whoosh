<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lançamento de Rasengan Gigante Interativo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            cursor: crosshair;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }
    </style>
</head>
<body class="relative w-screen h-screen bg-white font-sans text-slate-800">

    <!-- Interactive Canvas -->
    <canvas id="stageCanvas"></canvas>

    <!-- Top Overlay Control HUD -->
    <div class="absolute top-6 left-6 right-6 flex flex-col sm:flex-row justify-between items-center gap-4 z-20 max-w-4xl mx-auto pointer-events-none">
        
        <!-- Status Indicator -->
        <div class="glass-panel px-5 py-3 rounded-2xl text-white pointer-events-auto flex items-center gap-3">
            <div id="statusIcon" class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-400/50 flex items-center justify-center text-cyan-400 font-black">
                <i class="fa-solid fa-compact-disc animate-spin text-lg" style="animation-duration: 2s;"></i>
            </div>
            <div>
                <h1 id="jutsuTitle" class="font-orbitron font-extrabold text-sm sm:text-base tracking-wider text-cyan-400">RASENGAN</h1>
                <p id="jutsuSub" class="text-[11px] text-slate-300">Pressione e segure para carregar chakra!</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-3 pointer-events-auto">
            <!-- Level Indicator Badge -->
            <div class="glass-panel px-4 py-2 rounded-xl text-xs font-orbitron text-cyan-300 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                <span id="powerLevelLabel">NÍVEL: RASENGAN</span>
            </div>

            <!-- Audio Toggle -->
            <button onclick="toggleAudio()" id="audioBtn" class="w-11 h-11 rounded-xl glass-panel flex items-center justify-center text-slate-200 hover:text-cyan-400 transition-colors">
                <i id="audioIcon" class="fa-solid fa-volume-high text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Center Hold Prompt -->
    <div id="instructionPrompt" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel px-6 py-2.5 rounded-full text-xs font-orbitron text-cyan-300 flex items-center gap-2 shadow-2xl">
            <i class="fa-solid fa-hand-pointer animate-bounce text-cyan-400"></i>
            <span>SEGURE NA TELA PARA AUMENTAR O TAMANHO DO RASENGAN</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Web Audio Synthesizer
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let audioEnabled = true;

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('audioIcon');
            icon.className = audioEnabled ? 'fa-solid fa-volume-high text-sm' : 'fa-solid fa-volume-xmark text-sm text-slate-500';
        }

        function playSound(type, freqFactor = 1) {
            if (!audioEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'charge') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150 * freqFactor, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(500 * freqFactor, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'launch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800 * freqFactor, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'impact') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200 * freqFactor, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch(e){}
        }

        // State Machine
        let isHolding = false;
        let holdStartTime = 0;
        let holdPos = { x: 0, y: 0 };
        let currentRadius = 32;
        const MIN_RADIUS = 32;
        const MAX_RADIUS = 125;
        let spinAngle = 0;
        let shake = 0;

        let projectiles = [];
        let particles = [];
        let shockwaves = [];

        // Dynamic Label Elements
        const jutsuTitle = document.getElementById('jutsuTitle');
        const jutsuSub = document.getElementById('jutsuSub');
        const powerLevelLabel = document.getElementById('powerLevelLabel');

        // Draw exact spiraling Rasengan icon from the button
        function drawExactRasengan(context, cx, cy, radius, rotationAngle) {
            context.save();
            context.translate(cx, cy);

            // Subtle dark contrast rim for light background visibility
            context.beginPath();
            context.arc(0, 0, radius, 0, Math.PI * 2);
            context.fillStyle = 'rgba(0, 50, 120, 0.12)';
            context.fill();

            // Outer Soft Radial Glow
            const grad = context.createRadialGradient(0, 0, radius * 0.1, 0, 0, radius * 1.4);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.25, 'rgba(0, 240, 255, 0.95)');
            grad.addColorStop(0.65, 'rgba(0, 100, 255, 0.45)');
            grad.addColorStop(1, 'rgba(0, 20, 80, 0)');

            context.fillStyle = grad;
            context.beginPath();
            context.arc(0, 0, radius * 1.4, 0, Math.PI * 2);
            context.fill();

            // Inner Spiraling Wind Arc Lines
            for (let i = 0; i < 6; i++) {
                context.save();
                context.rotate(rotationAngle + (i * Math.PI / 3));
                context.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                context.lineWidth = Math.max(1.8, radius * 0.05);
                context.beginPath();
                context.arc(0, 0, radius * 0.45 + (i * (radius * 0.05)), 0, Math.PI * 0.6);
                context.stroke();
                context.restore();
            }

            // Counter-spinning secondary chakra layer
            for (let j = 0; j < 4; j++) {
                context.save();
                context.rotate(-rotationAngle * 1.3 + (j * Math.PI / 2));
                context.strokeStyle = 'rgba(0, 240, 255, 0.85)';
                context.lineWidth = Math.max(1.2, radius * 0.04);
                context.beginPath();
                context.arc(0, 0, radius * 0.6, 0, Math.PI * 0.5);
                context.stroke();
                context.restore();
            }

            // Intense Incandescent Core Hotspot
            context.fillStyle = '#ffffff';
            context.shadowColor = '#00f0ff';
            context.shadowBlur = radius * 0.4;
            context.beginPath();
            context.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
            context.fill();

            context.restore();
        }

        // Pointer Controls
        function startHold(e) {
            if (e.target.closest('.glass-panel') || e.target.closest('button')) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            isHolding = true;
            holdStartTime = Date.now();
            holdPos = { x: clientX - rect.left, y: clientY - rect.top };
            currentRadius = MIN_RADIUS;
        }

        function moveHold(e) {
            if (!isHolding) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            holdPos = { x: clientX - rect.left, y: clientY - rect.top };
        }

        function endHold(e) {
            if (!isHolding) return;
            isHolding = false;

            const startX = canvas.width / 2;
            const startY = canvas.height - 80;
            const dx = holdPos.x - startX;
            const dy = holdPos.y - startY;
            const dist = Math.hypot(dx, dy);

            const speed = 20;
            const vx = (dx / dist) * speed;
            const vy = (dy / dist) * speed;

            projectiles.push({
                x: startX,
                y: startY,
                targetX: holdPos.x,
                targetY: holdPos.y,
                vx: vx,
                vy: vy,
                radius: currentRadius
            });

            playSound('launch', currentRadius / MIN_RADIUS);

            // Reset UI HUD
            jutsuTitle.textContent = "RASENGAN";
            jutsuSub.textContent = "Pressione e segure para carregar chakra!";
            powerLevelLabel.textContent = "NÍVEL: RASENGAN";
        }

        canvas.addEventListener('mousedown', startHold);
        canvas.addEventListener('mousemove', moveHold);
        window.addEventListener('mouseup', endHold);

        canvas.addEventListener('touchstart', startHold, { passive: false });
        canvas.addEventListener('touchmove', moveHold, { passive: false });
        window.addEventListener('touchend', endHold);

        // Main Animation Loop
        function animate() {
            spinAngle += 0.15;

            ctx.save();
            if (shake > 0) {
                const sx = (Math.random() - 0.5) * shake;
                const sy = (Math.random() - 0.5) * shake;
                ctx.translate(sx, sy);
                shake *= 0.88;
                if (shake < 0.5) shake = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Charge Mode
            if (isHolding) {
                const elapsed = (Date.now() - holdStartTime) / 1000;
                currentRadius = Math.min(MAX_RADIUS, MIN_RADIUS + elapsed * 55);

                const chargeX = canvas.width / 2;
                const chargeY = canvas.height - 100;

                // Update Level Text dynamically
                if (currentRadius < 55) {
                    jutsuTitle.textContent = "RASENGAN";
                    powerLevelLabel.textContent = "NÍVEL: RASENGAN";
                } else if (currentRadius < 95) {
                    jutsuTitle.textContent = "ŌDAMA RASENGAN";
                    powerLevelLabel.textContent = "NÍVEL: ŌDAMA";
                } else {
                    jutsuTitle.textContent = "CHŌ ŌDAMA RASENGAN";
                    powerLevelLabel.textContent = "NÍVEL: CHŌ ŌDAMA";
                }
                jutsuSub.textContent = `Poder Concentrado: ${Math.round((currentRadius / MAX_RADIUS) * 100)}%`;

                drawExactRasengan(ctx, chargeX, chargeY, currentRadius, spinAngle);

                if (Math.random() < 0.4) {
                    playSound('charge', currentRadius / MIN_RADIUS);
                }

                // Inward Chakra Particles
                for (let i = 0; i < 3; i++) {
                    const pAngle = Math.random() * Math.PI * 2;
                    const pDist = currentRadius * 1.6 + Math.random() * 30;
                    particles.push({
                        x: chargeX + Math.cos(pAngle) * pDist,
                        y: chargeY + Math.sin(pAngle) * pDist,
                        vx: (chargeX - (chargeX + Math.cos(pAngle) * pDist)) * 0.09,
                        vy: (chargeY - (chargeY + Math.sin(pAngle) * pDist)) * 0.09,
                        size: Math.random() * 3.5 + 1,
                        alpha: 0.85,
                        color: '#00f0ff'
                    });
                }
            }

            // Update Flying Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;

                drawExactRasengan(ctx, p.x, p.y, p.radius, spinAngle);

                // Flight Trail
                particles.push({
                    x: p.x + (Math.random() - 0.5) * p.radius,
                    y: p.y + (Math.random() - 0.5) * p.radius,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    size: Math.random() * 4 + 1,
                    alpha: 0.75,
                    color: '#00f0ff'
                });

                // Arrival & Detonation
                const distToTarget = Math.hypot(p.targetX - p.x, p.targetY - p.y);
                if (distToTarget < 22 || p.y < -100 || p.x < -100 || p.x > canvas.width + 100) {
                    shake = p.radius * 0.45;
                    playSound('impact', p.radius / MIN_RADIUS);

                    shockwaves.push({
                        x: p.targetX,
                        y: p.targetY,
                        radius: p.radius * 0.4,
                        maxRadius: p.radius * 3.8,
                        alpha: 1
                    });

                    for (let k = 0; k < p.radius * 1.3; k++) {
                        const expAngle = Math.random() * Math.PI * 2;
                        const expSpeed = Math.random() * (p.radius * 0.22) + 2;
                        particles.push({
                            x: p.targetX,
                            y: p.targetY,
                            vx: Math.cos(expAngle) * expSpeed,
                            vy: Math.sin(expAngle) * expSpeed,
                            size: Math.random() * 5 + 2,
                            alpha: 1,
                            color: Math.random() > 0.3 ? '#00f0ff' : '#0066ff'
                        });
                    }

                    projectiles.splice(i, 1);
                }
            }

            // Shockwaves
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.radius += 9;
                sw.alpha -= 0.03;

                ctx.save();
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 240, 255, ${Math.max(0, sw.alpha)})`;
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius * 0.7, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 120, 255, ${Math.max(0, sw.alpha * 0.5)})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                if (sw.alpha <= 0) shockwaves.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.02;

                ctx.fillStyle = pt.color;
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();

                if (pt.alpha <= 0) particles.splice(i, 1);
            }

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
